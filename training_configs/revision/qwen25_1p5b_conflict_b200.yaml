model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
torch_dtype: bfloat16
attn_implementation: sdpa

dataset_mixer:
  PLACEHOLDER_DATASET: 1.0
dataset_splits:
  - train
  - test
preprocessing_num_workers: 8

bf16: true
loss_type: ronpo
max_history_t: 1
history_weights: [1.0]
ratio: 0.3333
eta: 0.0075
dpo_beta: 0.01
simpo_beta: 2.0
simpo_gamma: 0.6
ronpo_alpha: 1.0
ronpo_tau: 0.05
ronpo_target_column: ronpo_target
reference_anchor_weight: 0.0
preference_sft_weight: 0.0
beta: 10
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
weight_decay: 0.0
seed: 42

max_steps: 900
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: false
max_length: 2048
max_prompt_length: 1800

do_eval: false
eval_strategy: "no"
logging_steps: 5
log_level: info
generate_during_eval: false
load_best_model_at_end: false

save_strategy: "no"
push_to_hub: false
report_to:
  - wandb

output_dir: PLACEHOLDER_OUTPUT
run_name: PLACEHOLDER_RUN
