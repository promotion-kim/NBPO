# Qwen3-8B revision smoke config. Full revision runs must use the shared
# protocol configs generated from the same fields, not this 20-step smoke cap.
model_name_or_path: /ext_hdd/sjkim/huggingface/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218
torch_dtype: null
attn_implementation: eager

dataset_mixer:
  /ext_hdd/sjkim/mnpo/revision_qwen3_8b/smoke/precomputed/full_expect: 1.0

dataset_splits:
  - train
  - test

preprocessing_num_workers: 12

bf16: true
loss_type: ronpo
max_history_t: 1
history_weights: [1.0]
ronpo_alpha: 1.0
ronpo_tau: 0.05
ronpo_target_column: ronpo_target
beta: 10
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
weight_decay: 0.0
seed: 42

gradient_accumulation_steps: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

max_steps: 20
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
max_length: 2048
max_prompt_length: 1800

do_eval: true
eval_strategy: steps
eval_steps: 10
logging_steps: 1
log_level: info
generate_during_eval: false

metric_for_best_model: eval_loss
load_best_model_at_end: false

save_strategy: steps
save_steps: 20
save_total_limit: 1
push_to_hub: false

report_to:
  - none

output_dir: /ext_hdd/sjkim/mnpo/revision_qwen3_8b/smoke/train/ronpo_full_expect_s42
run_name: rev-smoke-ronpo-s42
