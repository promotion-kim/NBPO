# ================================
# Model Arguments
# ================================
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
torch_dtype: null
attn_implementation: eager

# ================================
# Data & Preprocessing
# ================================
dataset_mixer:
  data/qwen2.5-1.5b-instruct_iter1_precomputed_ronpo: 1.0

dataset_splits:
  - train
  - test

preprocessing_num_workers: 12

# ================================
# Training Parameters
# ================================
bf16: true
loss_type: ronpo
max_history_t: 1
history_weights: [1.0]
ronpo_alpha: 1.0
ronpo_tau: 0.05
ronpo_target_column: ronpo_target
beta: 10
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
seed: 42

gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

num_train_epochs: 1
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
max_length: 2048
max_prompt_length: 1800

# ================================
# Evaluation & Logging
# ================================
do_eval: true
evaluation_strategy: steps
eval_steps: 20
logging_steps: 5
log_level: info

metric_for_best_model: eval_loss
load_best_model_at_end: true

# ================================
# Saving & Reporting
# ================================
save_strategy: steps
save_steps: 20
save_total_limit: 5
push_to_hub: false

report_to:
  - wandb

# ================================
# Output
# ================================
output_dir: ./outputs/qwen2.5-1.5b-instruct_ronpo_stage_1
run_name: qwen2.5-1.5b-instruct_ronpo_stage_1
