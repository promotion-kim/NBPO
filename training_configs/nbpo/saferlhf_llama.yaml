# NBPO stage config -- SafeRLHF / Llama-3.1-8B-Instruct (helpfulness + harmlessness).
# Consumed by: python -m scripts.nbpo.run_nbpo_stage --config <this file>
# Manuscript sources: tab:data-sampling-hparams, tab:policy-training-hparams, alg:nbpo.
# Fill every PLACEHOLDER_* path before a real run; the toy fixture
# (tests/fixtures/nbpo_toy/config.yaml) is the runnable CPU example.
stage: 0
dataset: saferlhf_llama
objectives:
  config: ../../training_configs/nbpo/objectives/saferlhf.yaml
  names: [helpfulness, harmlessness]
judge:
  backend: vllm
  model_path: Qwen/Qwen3-32B        # training preference judge (manuscript)
  max_retries: 2
  tensor_parallel_size: 4
  max_model_len: 8192
  # Qwen3 reasoning trace is suppressed: VllmJudge passes enable_thinking=False
  # to apply_chat_template (the exact flag the manuscript says to record).
sampling:
  policy_responses_per_prompt: 4     # response files below must carry 4 seeds each
  reference_comparators_per_prompt: 4
  pair_proposal: all_six_unordered_pairs
  generation_temperature: 0.9
  generation_top_p: 0.95
  max_response_tokens: 512
responses:
  policy_files:
    s0: PLACEHOLDER_POLICY_S0.json
    s1: PLACEHOLDER_POLICY_S1.json
    s2: PLACEHOLDER_POLICY_S2.json
    s3: PLACEHOLDER_POLICY_S3.json
  reference_files:
    r0: PLACEHOLDER_REF_R0.json
    r1: PLACEHOLDER_REF_R1.json
    r2: PLACEHOLDER_REF_R2.json
    r3: PLACEHOLDER_REF_R3.json
monitoring:
  # Held-out monitoring batch for the Algorithm-1 gate. The manuscript's
  # monitoring-batch-size cell is BLANK, so this field is required with no
  # default; it must be disjoint from training and final-eval prompts
  # (enforced by run_nbpo_stage).
  prompts_file: PLACEHOLDER_MONITORING_PROMPTS.json
  candidate_policy_files:
    s0: PLACEHOLDER_CANDIDATE_S0.json
    s1: PLACEHOLDER_CANDIDATE_S1.json
    s2: PLACEHOLDER_CANDIDATE_S2.json
    s3: PLACEHOLDER_CANDIDATE_S3.json
  reference_files:
    r0: PLACEHOLDER_MON_REF_R0.json
    r1: PLACEHOLDER_MON_REF_R1.json
    r2: PLACEHOLDER_MON_REF_R2.json
    r3: PLACEHOLDER_MON_REF_R3.json
final_eval:
  prompts_file: PLACEHOLDER_FINAL_EVAL_PROMPTS.json   # judged by Llama-3.3-70B-Instruct
solver:
  eta: 1.0                            # proximal coefficient eta_t (T = 1 outer stage)
  opponent_betas: [0.25, 0.25]        # explicit; NOT the metrics-only trainer `beta: 10.0`
  lambda_box: [1.0e-3, 1.0e+3]
  M: 300000                           # dual iterations (SafeRLHF column)
  gamma: 2.0                          # dual step size gamma_m (SafeRLHF column)
  R: 1                                # DISCLOSED APPROXIMATION: one opponent reweighting
                                      # per dual update; fixed-point residual is reported
  aggregation: nash                   # matched controls: utilitarian|absolute_maxmin|surplus_maxmin
  # warm_start_lambda: <prev stage solution.json>   # lambda^(0)=1 at t=0 (no warm start)
targets:
  mode: sampled                       # manuscript Eq. (24); rao_blackwell is a labeled variant
  seed: 42
trainer:
  # run_mnpo settings for the candidate fit (tab:policy-training-hparams; full
  # fine-tuning, single device, seed 42). Materialize into a run_mnpo YAML via
  # commands.train below.
  loss_type: nbpo
  nbpo_target_column: nbpo_weighted_z
  logp_reduction: sum                 # sequence-sum response logps (required for nbpo)
  eta: 1.0                            # applied to the target exactly once, in the trainer
  max_history_t: 1
  history_weights: [1.0]
  reference_anchor_weight: 0.0        # no auxiliary anchor loss
  preference_sft_weight: 0.0          # no preference-SFT loss
  optim: adafactor
  learning_rate: 5.0e-7
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_steps: 300
  max_length: 2048
  max_prompt_length: 1024
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  seed: 42
gate:
  parent_model: PLACEHOLDER_PI_T_CHECKPOINT
  promote_to: PLACEHOLDER_PI_NEXT_CHECKPOINT
commands:
  # Real-mode step templates ({workdir}/{pairs_dir}/{candidate}/{parent} are
  # substituted by run_nbpo_stage). precompute MUST pass --logp_reduction sum so
  # the provenance sidecar matches the trainer's requirement.
  precompute: >-
    python -m mnpo_scripts.precompute --model_name_or_path {parent}
    --ref_model meta-llama/Llama-3.1-8B-Instruct --history_paths {parent}
    --train_dir {pairs_dir}/pairs_train.jsonl --output_dir {workdir}/precomputed
    --logp_reduction sum --ronpo_target_mode none --apply_chat_template true
    --max_length 2048 --max_prompt_length 1024
  train: >-
    python -m accelerate.commands.launch --num_processes 1 -m mnpo_scripts.run_mnpo
    {workdir}/run_config.yaml
  decode_candidate: >-
    bash scripts/bpo/decode_eval.sh {candidate} {workdir}/candidate_monitoring
