# Materialize model path/revision, dataset, manifest hash, loss and output before launch.
# loss_type nbpo_wbc: online_reference false. loss_type nbpo: online_reference true.
torch_dtype: bfloat16
use_peft: false
attn_implementation: sdpa
train_split: train
eval_split: dev
auto_insert_empty_system_msg: false
nbpo_target_mode: canonical_logratio
nbpo_target_column: nbpo_logratio_target
nbpo_target_units: final_logratio_change
nbpo_eta_already_included: true
nbpo_require_immutable_tokens: true
nbpo_num_candidates: 8
nbpo_require_fp32_optimizer: true
nbpo_reference_init_atol: 0.0001
logp_reduction: sum
logp_chunk_size: 64
max_history_t: 1
history_weights: [1.0]
reference_anchor_weight: 0.0
preference_sft_weight: 0.0
sft_weight: 0.0
eta: 1.0
max_length: 2048
max_prompt_length: 1024
truncation_mode: keep_end
optim: adamw_torch
learning_rate: 5.0e-7
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
weight_decay: 0.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
disable_dropout: true
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
deepspeed: training_configs/nbpo/repair_20260909/deepspeed_zero2.json
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
max_steps: 1750
seed: 42
data_seed: 42
dataset_num_proc: 1
remove_unused_columns: false
logging_steps: 1
eval_strategy: steps
eval_steps: 250
save_strategy: steps
save_steps: 250
save_total_limit: 2
save_only_model: true
load_best_model_at_end: false
report_to: none
push_to_hub: false
