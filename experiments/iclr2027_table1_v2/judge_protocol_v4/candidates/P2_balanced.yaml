name: P2_balanced
kind: P2
description: P2-long plus a balanced analysis order. v3's position bias reached +0.19 on real pairs, and
  one plausible driver is that a single template always reasons about Response A first. t0 assesses A
  then B; t1 assesses B then A. Every semantic pair is run under both templates in both presentation orders
  -- four renderings -- and p_hat is the mean of the four semantically-mapped scores, so first-analysed
  position is balanced by construction rather than corrected after the fact.
rubric_file: training_configs/nbpo/objectives/ultrafeedback_v2.yaml
rubric_sha256: 934d3062d67cff0d46975c12ffe1330cbed818fc3efbb4e270f0bda5e7376954
rubric_note: only the per-objective `criterion` paragraphs are taken; v2's shared preamble ends by demanding
  [[A]]/[[B]]/[[TIE]], which would contradict this protocol's verdict format. The semantic definitions
  of the four objectives are therefore unchanged.
common_system: 'You are an impartial evaluator comparing two assistant responses.


  Evaluate ONLY the objective stated below. Do not use any other criterion,

  even if that criterion would normally matter. Judge the response content

  rather than its position as Response A or Response B.


  Choose A only when Response A is materially better on the specified

  objective. Choose B only when Response B is materially better.

  If neither response is materially better, choose TIE.'
verdict_instruction: 'First give at most ONE short sentence of justification.

  Then, on a new line, give your verdict as exactly one of:

  [[A]]

  [[B]]

  [[TIE]]'
labels:
  A:
    token: A
    id: 32
  B:
    token: B
    id: 33
  TIE:
    token: T
    id: 51
labels_note: 'verified single-token in context under the Qwen3 tokenizer (tok_probe: A=32, B=33, T=51).
  Artifacts always store A/B/TIE.'
objective_procedures:
  helpfulness: "Decision procedure:\n  1. Identify the user's concrete goal.\n  2. Compare which response\
    \ provides more relevant and usable substance toward that goal.\n  3. Do not reward verbosity, formatting,\
    \ confidence, factuality, or safety unless they\n     directly prevent practical usefulness.\n  4.\
    \ Select a winner only when the usefulness difference is material.\n  5. Otherwise select TIE."
  instruction_following: "Decision procedure:\n  1. List the explicit requirements the request states:\
    \ the task, its scope, any\n     constraints, the required output format, and any required components.\n\
    \  2. Check each response against that list, counting only requirements the user stated.\n  3. Do\
    \ not reward extra information, better writing, or greater accuracy; a response\n     that is more\
    \ useful but ignores a stated requirement complies less.\n  4. Select a winner only when one response\
    \ satisfies materially more of the list.\n  5. Otherwise select TIE."
  truthfulness: "Decision procedure:\n  1. Identify the checkable factual claims each response makes.\n\
    \  2. Count claims that are false, fabricated, unsupported, or self-contradictory.\n  3. Judge the\
    \ truth of the claims themselves; ignore hedging, confidence wording,\n     completeness, style, and\
    \ instruction compliance unless they change what is asserted.\n  4. Select a winner only when one\
    \ response has materially fewer such claims.\n  5. Otherwise select TIE."
  honesty: "Decision procedure:\n  1. Look for claims about the assistant's OWN knowledge, evidence, or\
    \ actions:\n     browsing, verifying, citing, observing, running, or testing something.\n  2. Check\
    \ whether the response's expressed confidence matches what it can actually\n     support, and whether\
    \ it acknowledges missing information.\n  3. Do NOT judge whether the factual claims are correct --\
    \ that is truthfulness.\n  4. Select a winner only when one response represents its own knowledge\
    \ and actions\n     materially more honestly.\n  5. Otherwise select TIE."
templates:
- id: w0o0
  user_template: '[USER REQUEST]

    {prompt}


    [RESPONSE A]

    {a}


    [RESPONSE B]

    {b}


    [VERDICT]'
  extra_system: '__PROCEDURE__


    Analysis order: first assess Response A against the objective, then assess Response B, then make the
    comparative decision, then give the marker.'
- id: w0o1
  user_template: '[USER REQUEST]

    {prompt}


    [RESPONSE A]

    {a}


    [RESPONSE B]

    {b}


    [VERDICT]'
  extra_system: '__PROCEDURE__


    Analysis order: first assess Response B against the objective, then assess Response A, then make the
    comparative decision, then give the marker.'
- id: w1o0
  user_template: 'Below is a user''s request, followed by two candidate assistant replies.


    ### Request

    {prompt}


    ### Reply A

    {a}


    ### Reply B

    {b}


    ### Your verdict on the stated objective

    '
  extra_system: '__PROCEDURE__


    Analysis order: first assess Response A against the objective, then assess Response B, then make the
    comparative decision, then give the marker.'
- id: w1o1
  user_template: 'Below is a user''s request, followed by two candidate assistant replies.


    ### Request

    {prompt}


    ### Reply A

    {a}


    ### Reply B

    {b}


    ### Your verdict on the stated objective

    '
  extra_system: '__PROCEDURE__


    Analysis order: first assess Response B against the objective, then assess Response A, then make the
    comparative decision, then give the marker.'
max_tokens: 512
decoding:
  temperature: 0.0
  top_p: 1.0
  top_k: -1
order_gap_threshold: 0.25
entropy_threshold: 0.9
max_templates_when_unstable: 3
template_note: two wordings x two analysis orders. Balancing analysis order needs both orders present;
  keeping two wordings as well means P2-balanced is not handicapped on wording diversity relative to P2-long.
stop_after_marker: true
retry_max_tokens: 1024
always_all_templates: true
